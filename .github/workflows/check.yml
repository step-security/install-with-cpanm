name: Check workflow

on: [push, pull_request]

jobs:
  cpanm:
    runs-on: ubuntu-latest
    name: 'install cpanm'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uses install-with-cpanm
        uses: ./
      - name: which cpanm
        run: which cpanm

  ### ------------------------------------------------
  ### Install a single module
  ### ------------------------------------------------

  one_module:
    runs-on: ubuntu-latest
    name: 'cpanm and a module'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uses install-with-cpanm
        uses: ./
        with:
          install: 'Simple::Accessor'
      - run: perl -MSimple::Accessor -e1

  one_module_macos:
    runs-on: macos-latest
    name: 'cpanm and a module (macOS)'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uses install-with-cpanm
        uses: ./
        with:
          install: 'Simple::Accessor'
      - run: perl -MSimple::Accessor -e1

  ### ------------------------------------------------
  ### Install multiple modules
  ### ------------------------------------------------

  multiple_modules:
    runs-on: ubuntu-latest
    name: 'cpanm & modules'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uses install-with-cpanm
        uses: ./
        with:
          install: |
            Simple::Accessor
            abbreviation
      - run: perl -MSimple::Accessor -e1
      - run: perl -Mabbreviation -e1

  ### ------------------------------------------------
  ### Install modules from a cpanfile
  ### ------------------------------------------------

  cpanfile_root:
    runs-on: ubuntu-latest
    name: 'cpanfile as root'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Create a cpanfile'
        run: |
          echo "requires 'Simple::Accessor';" > cpanfile.test
      - name: uses install-with-cpanm
        uses: ./
        with:
          cpanfile: 'cpanfile.test'
      - run: perl -MSimple::Accessor -e1

  cpanfile_nonroot:
    runs-on: ubuntu-latest
    name: 'cpanfile nonroot local::lib'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Create a cpanfile'
        run: |
          echo "requires 'Simple::Accessor';" > cpanfile.test
      - name: uses install-with-cpanm
        uses: ./
        with:
          path: 'cpanm-local'
          cpanfile: 'cpanfile.test'
          sudo: false
          args: '-L vendor'
      - run: sudo perl cpanm-local local::lib
      - run: perl -Mlocal::lib=--no-create,vendor -MSimple::Accessor -e1

  ### ------------------------------------------------
  ### Install a module and enable tests
  ### ------------------------------------------------

  with_tests:
    runs-on: ubuntu-latest
    name: 'install with tests'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uses install-with-cpanm
        uses: ./
        with:
          install: 'Simple::Accessor'
          tests: true
          args: '-v'
      - run: perl -MSimple::Accessor -e1

  ### ------------------------------------------------
  ### check perl-tester
  ### ------------------------------------------------

  perl_tester:
    runs-on: ubuntu-latest
    name: 'perl v${{ matrix.perl-version }}'

    strategy:
      fail-fast: false
      matrix:
        perl-version: ${{ github.actor == 'dependabot[bot]' && fromJSON('["5.38"]') || fromJSON('["5.36", "5.34", "5.32", "5.30", "5.28"]') }}

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uses install-with-cpanm
        uses: ./
        with:
          sudo: false
          install: |
            abbreviation
            ACH
      # checking that both modules are installed
      - run: perl -Mabbreviation -e1
      - run: perl -MACH -e1

  ## ------------------------------------------------
  ## testing with windows
  ## ------------------------------------------------
  windows:
    runs-on: windows-latest
    name: 'windows'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: perl -V
        run: perl -V

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'install-with-cpanm'

        uses: ./
        with:
          install: |
            abbreviation
            ACH
      # checking that both modules are installed
      - run: perl -Mabbreviation -e1
      - run: perl -MACH -e1

  ## ------------------------------------------------
  ## test with local-lib
  ## ------------------------------------------------
  local_lib:
    runs-on: ubuntu-latest
    name: 'local-lib'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'install-with-cpanm'
        uses: ./
        with:
          install: 'Simple::Accessor'
          local-lib: '~/perl5'
          sudo: false
          args: '-v'